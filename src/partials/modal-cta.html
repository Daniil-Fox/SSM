<div class="modal modal_cta" data-modal="cta">
  <div class="modal__body modal__content">
    <div class="cta__container">
      <div class="cta__content">
        <h2 class="cta__title">оставьте заявку</h2>
        <p class="cta__subtitle">
          Наш специалист свяжется с&nbsp;вами в&nbsp;течение рабочего дня
        </p>
        <p class="cta__text">
          Расскажите про&nbsp;объект&nbsp;— мы&nbsp;предварительно оценим
          стоимость и&nbsp;сроки, согласуем выезд инженера на&nbsp;площадку
          и&nbsp;предоставим техническое предложение.
        </p>

        <form action="#" class="modal__form form">
          <div class="form__field form__field--long">
            <label class="form__field-wrapper">
              <input
                type="text"
                class="form__input input-name"
                name="Имя"
                required
              />
              <div class="form__label">имя</div>
            </label>
          </div>

          <div class="form__field form__field--long">
            <label class="form__field-wrapper">
              <input
                type="text"
                class="form__input input-tel-email"
                name="контакт"
                required
              />
              <div class="form__label">телефон или email</div>
            </label>
          </div>

          <div class="form__field form__field--long">
            <label class="form__field-wrapper">
              <input type="text" class="form__input input-city" name="город" />
              <div class="form__label">город</div>
            </label>
          </div>

          <div class="form__field form__field--long">
            <label class="form__field-wrapper form__field-wrapper--area">
              <textarea
                class="form__input form__input--area input-mess"
                name="Сообщение"
              ></textarea>
              <div class="form__label">
                краткое описание задачи (необязательно)
              </div>
            </label>
          </div>
          <button class="btn btn-reset btn--accent form__btn">
            отправить заявку
          </button>
          <p class="form__extra">
            Отправляя заявку, вы соглашаетесь с&nbsp;<a href="#" target="_blank"
              >политикой обработки персональных данных</a
            >.
          </p>
        </form>
      </div>
      <div class="cta__img">
        <picture>
          <source
            srcset="./img/cta-mob.webp"
            type="image/webp"
            media="(max-width: 576px)"
          />
          <img
            loading="lazy"
            src="./img/cta.webp"
            class="image"
            width="1300"
            height="800"
            alt=""
          />
        </picture>
      </div>
    </div>
  </div>
</div>
